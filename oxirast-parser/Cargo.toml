[package]
name = "oxirast-parser"
description = "A fast, fine-grained WebAssembly frontend framework for Rust."
license = "MIT"
repository = "https://github.com/Michaelmk708/oxirast-rust_web_framework"
version = "1.0.0"
edition = "2021"
authors = ["Michael Kinuthia <michaelkinuthia708@gmail.com>"]
readme = "../README.md" 
keywords = ["wasm", "frontend", "webassembly", "framework", "reactivity"]
categories = ["wasm", "web-programming"]

[lib]
# This line is absolutely crucial. It tells the Rust compiler 
# that this crate generates code at compile-time.
proc-macro = true

[dependencies]
# 'syn' parses the raw token stream into a syntax tree
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
# 'quote' turns our parsed data back into Rust code
quote = "1.0"
# 'proc-macro2' gives us token streams we can easily manipulate
proc-macro2 = "1.0"